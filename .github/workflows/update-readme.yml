name: Update README progress

on:
  push:
    branches: [main]
    paths:
      - "*.cpp"
      - "scripts/update_readme.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_readme.py
      - name: Commit if the README changed
        run: |
          if git diff --quiet Readme.md; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git add Readme.md
          git commit -m "Update README progress table"
          git push
